name: Añadir submódulo

on:
  workflow_dispatch:
    inputs:
      repositorio:
        description: 'Nombre del repositorio de GitHub'
        required: true
        type: string
      carpeta:
        description: 'Nombre de la carpeta del submódulo'
        required: true
        type: string

permissions:
  contents: write

jobs:
  anadir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio principal
        uses: actions/checkout@v4

      - name: Añadir submódulo
        env:
          REPOSITORIO: ${{ inputs.repositorio }}
          CARPETA: ${{ inputs.carpeta }}
        run: |
          git submodule add \
            "https://github.com/meleiro/${REPOSITORIO}.git" \
            "$CARPETA"

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gitmodules
          git add -A

          git commit -m "Añadir nuevo submódulo"
          git push
